name: Investment OS V4 宏观扫描

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只生成合并消息，不发送飞书"
        required: false
        type: boolean
        default: false
      send_test_message:
        description: "额外发送飞书连通性测试消息"
        required: false
        type: boolean
        default: false
  schedule:
    # 定时任务仅从默认分支 main 注册并执行。
    - cron: "0 * * * *"

concurrency:
  group: investment-os-macro
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macro:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖并校验配置
        run: |
          pip install -r requirements.txt
          python -m src.config_validator
      - name: 恢复统一事件与决策状态
        uses: actions/cache/restore@v4
        with:
          path: state/alerts.json
          key: investment-os-shared-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            investment-os-shared-state-
      - name: 扫描宏观日历与市场风险
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: >-
          python -m src.main --mode macro
          ${{ inputs.dry_run && '--dry-run' || '' }}
          ${{ inputs.send_test_message && '--test-message' || '' }}
      - name: 保存统一事件与决策状态
        if: always() && hashFiles('state/alerts.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state/alerts.json
          key: investment-os-shared-state-${{ github.run_id }}-${{ github.run_attempt }}
